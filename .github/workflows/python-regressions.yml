name: Python regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parser and geospatial test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.5 geopandas==1.1.4 openpyxl==3.1.5 pytest==9.1.1
      - name: Run complete Python regression suite (including bundled OS fixture)
        run: python -m pytest -q tests
