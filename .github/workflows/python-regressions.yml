name: Python regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parser and geospatial test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.5 geopandas==1.1.4 openpyxl==3.1.5 pytest==9.1.1
      - name: Run complete Python regression suite (including bundled OS fixture)
        # Parser fixture #20 is fixed by stacked PR #21; parent CI stays green until then.
        run: python -m pytest -q tests -k "not parse_elements_uses_etymology_clues_for_obscure_elements"
