name: Python regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parser and geospatial test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.5 geopandas==1.1.4 openpyxl==3.1.5 pytest==9.1.1
      - name: Run portable parser and GeoDataFrame tests
        # OS Open Names fixture is not bundled; all other tests use fixtures or bundled KEPN.
        run: python -m pytest -q tests -k "not combine_csvs_to_dataframe_uses_header_and_concatenates_rows"
